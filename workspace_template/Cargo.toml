# Reconstruction workspace. Every setting below changes the output bytes, so
# each one is a guess you confirm with the score from `solopen.py try`.
[workspace]
members = ["programs/my_program"]
resolver = "2"

[profile.release]
# Anchor's `anchor init` template sets these three (checked against v0.30.1);
# most deployed Anchor programs were built with them. Some teams turn LTO off
# (daos.fun used lto = false). Change one at a time and watch the coverage score.
overflow-checks = true
lto = "fat"
codegen-units = 1

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
